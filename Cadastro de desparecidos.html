<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPES · Cadastrar desaparecido</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
<script>
    // Verifica se o usuário está logado
    const token = localStorage.getItem('token');
    const userName = localStorage.getItem('userName');
    const btnEntrar = document.getElementById('btnEntrar');
    const btnCadastrar = document.getElementById('btnCadastrar');
    const areaUsuario = document.getElementById('areaUsuario');
    const nomeUsuario = document.getElementById('nomeUsuario');
    const btnSair = document.getElementById('btnSair');

    if (token && userName) {
        // Usuário está logado
        if (btnEntrar) btnEntrar.style.display = 'none';
        if (btnCadastrar) btnCadastrar.style.display = 'none';
        if (areaUsuario) areaUsuario.style.display = 'flex';
        if (nomeUsuario) nomeUsuario.textContent = `Olá, ${userName.split(' ')[0]}`;
    }

    // Botão Sair
    if (btnSair) {
        btnSair.addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('Deseja sair da sua conta?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('userName');
                window.location.href = 'index.html';
            }
        });
    }
</script>
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f0f5fa 0%, #dae8f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            margin: 0;
        }

        /* ----- CARD ----- */
        .card {
            background: #ffffff;
            max-width: 700px;
            width: 100%;
            padding: 2.5rem 2.5rem 2.8rem;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            border: 2px solid rgba(86, 164, 238);
        }

        /* cabeçalho */
        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0b2b4a;
            letter-spacing: -0.5px;
        }

        .brand .subhead {
            font-size: 0.8rem;
            font-weight: 500;
            color: #2a5f7a;
            background: #e6f0f8;
            display: inline-block;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            margin-top: 0.1rem;
        }

        .brand .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1d3b55;
            margin-top: 1.2rem;
        }

        /* formulário */
        .form-section {
            margin-top: 1.8rem;
        }

        .form-section .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: #1a3a54;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e6f0f8;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a3a54;
            margin-bottom: 0.3rem;
        }

        .form-group label .hint {
            font-weight: 400;
            color: #6a8ba8;
            font-size: 0.8rem;
            margin-left: 0.3rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #d4e0ec;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #f9fcff;
            transition: 0.2s;
            outline: none;
            color: #0b2b4a;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2a6f9c;
            box-shadow: 0 0 0 4px rgba(42, 111, 156, 0.12);
            background: #ffffff;
        }

        .form-group input::placeholder {
            color: #a1b9ce;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }

        /* campo de upload (foto) */
        .upload-area {
            border: 2px dashed #cbddee;
            border-radius: 60px;
            padding: 1rem 1.5rem;
            background: #f9fcff;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: 0.2s;
            color: #2a5f7a;
        }

        .upload-area:hover {
            border-color: #2a6f9c;
            background: #f0f6fe;
        }

        .upload-area i {
            font-size: 1.6rem;
            color: #2a6f9c;
        }

        .upload-area span {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        /* revisão */
        .review-box {
            background: #eef5fc;
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            margin: 1.2rem 0 0.8rem;
            border-left: 4px solid #2a6f9c;
        }

        .review-box p {
            font-size: 0.95rem;
            color: #1d3b55;
            font-weight: 500;
        }

        .review-box p i {
            color: #2a6f9c;
            margin-right: 0.5rem;
        }

        .review-box .next-step {
            font-weight: 600;
            color: #0b2b4a;
        }

        /* botão */
        .btn-continue {
            width: 100%;
            padding: 0.85rem;
            margin-top: 1.8rem;
            background: #2a6f9c;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(42, 111, 156, 0.25);
            letter-spacing: 0.5px;
        }

        .btn-continue:hover {
            background: #1d5a7e;
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(42, 111, 156, 0.35);
        }

        .btn-continue:active {
            transform: scale(0.98);
        }

        /* responsivo */
        @media (max-width: 600px) {
            .card {
                padding: 2rem 1.5rem 2.2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .brand h1 {
                font-size: 1.9rem;
            }

            .brand .page-title {
                font-size: 1.3rem;
            }

            .upload-area {
                padding: 0.8rem 1.2rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 1.5rem 1rem 1.8rem;
            }
        }
    
        /* ----- MENSAGEM DE STATUS / NOME DA FOTO ----- */
        .status {
            display: none;
            margin-top: 1.2rem;
            padding: 0.8rem 1.2rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .status.erro {
            display: block;
            background: #fdeaea;
            color: #9b2c2c;
            border-left: 4px solid #b13e3e;
        }

        .status.ok {
            display: block;
            background: #e8f6ee;
            color: #1f6b43;
            border-left: 4px solid #2e9a62;
        }

        .status.info {
            display: block;
            background: #eef5fc;
            color: #1d3b55;
            border-left: 4px solid #2a6f9c;
        }

        .status a {
            color: inherit;
            font-weight: 700;
            text-decoration: underline;
        }

        .btn-continue:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .upload-area .file-name {
            display: block;
            font-size: 0.8rem;
            font-weight: 400;
            color: #6a8ba8;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- cabeçalho -->
        <div class="brand">
            <img style="width: 100px; height: 100px;" src="Imagens do site/Logo da SPES.png" alt="Logo da SPES">
            <h1>SPES</h1>
            <div class="page-title">Cadastrar pessoa desaparecida</div>
        </div>

        <form id="form-desaparecido" action="#" method="post">

            <!-- Dados pessoais -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-user" style="margin-right:8px; color:#2a6f9c;"></i> Dados pessoais</div>

                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Nome da pessoa desaparecida" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="data_nasc">Data de nascimento</label>
                        <input type="date" id="data_nasc" name="data_nasc" />
                    </div>
                    <div class="form-group">
                        <label for="cor_raca">Cor / Raça</label>
                        <select id="cor_raca" name="cor_raca">
                            <option value="" selected>Selecione</option>
                            <option>Branca</option>
                            <option>Preta</option>
                            <option>Parda</option>
                            <option>Amarela</option>
                            <option>Indígena</option>
                            <option>Outra</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="altura">Altura <span class="hint">(cm)</span></label>
                        <input type="number" id="altura" name="altura" placeholder="cm" step="0.1" min="30" max="250" />
                    </div>
                    <div class="form-group">
                        <label for="peso">Peso <span class="hint">(kg)</span></label>
                        <input type="number" id="peso" name="peso" placeholder="kg" step="0.1" min="1" max="400" />
                    </div>
                </div>
            </div>

            <!-- Contato -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-phone" style="margin-right:8px; color:#2a6f9c;"></i> Contato</div>
                <div class="form-group">
                    <label for="contato">Número de contato</label>
                    <input type="tel" id="contato" name="contato" placeholder="(00) 00000-0000" />
                </div>
            </div>

            <!-- Informações -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-info-circle" style="margin-right:8px; color:#2a6f9c;"></i> Informações</div>

                <div class="form-group">
                    <label for="informacoes">Apelido, roupas, etc.</label>
                    <input type="text" id="informacoes" name="informacoes" placeholder="Informações que ajudem no caso" />
                </div>
            </div>

            <!-- Últimas Localizações -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-map-pin" style="margin-right:8px; color:#2a6f9c;"></i> Últimas Localizações</div>

                <div class="form-group">
                    <label for="ultimas_localizacoes">Lugares favoritos do desaparecido</label>
                    <input type="text" id="ultimas_localizacoes" name="ultimas_localizacoes" placeholder="Ex: parque, escola, trabalho..." />
                </div>
            </div>

            <!-- Local e data do desaparecimento -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-calendar-alt" style="margin-right:8px; color:#2a6f9c;"></i> Local e data do desaparecimento</div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="EPD">Estado</label>
                        <select name="EPD" id="EPD" required>
                            <option value="" selected disabled>Selecione</option>
                        <option value="Acre">Acre (AC)</option>
                        <option value="Alagoas">Alagoas (AL)</option>
                        <option value="Amapá">Amapá (AP)</option>
                        <option value="Amazonas">Amazonas (AM)</option>
                        <option value="Bahia">Bahia (BA)</option>
                        <option value="Ceará">Ceará (CE)</option>
                        <option value="Distrito Federal">Distrito Federal (DF)</option>
                        <option value="Espírito Santo">Espírito Santo (ES)</option>
                        <option value="Goiás">Goiás (GO)</option>
                        <option value="Maranhão">Maranhão (MA)</option>
                        <option value="Mato Grosso">Mato Grosso (MT)</option>
                        <option value="Mato Grosso do Sul">Mato Grosso do Sul (MS)</option>
                        <option value="Minas Gerais">Minas Gerais (MG)</option>
                        <option value="Pará">Pará (PA)</option>
                        <option value="Paraíba">Paraíba (PB)</option>
                        <option value="Paraná">Paraná (PR)</option>
                        <option value="Pernambuco">Pernambuco (PE)</option>
                        <option value="Piauí">Piauí (PI)</option>
                        <option value="Rio de Janeiro">Rio de Janeiro (RJ)</option>
                        <option value="Rio Grande do Norte">Rio Grande do Norte (RN)</option>
                        <option value="Rio Grande do Sul">Rio Grande do Sul (RS)</option>
                        <option value="Rondônia">Rondônia (RO)</option>
                        <option value="Roraima">Roraima (RR)</option>
                        <option value="Santa Catarina">Santa Catarina (SC)</option>
                        <option value="São Paulo">São Paulo (SP)</option>
                        <option value="Sergipe">Sergipe (SE)</option>
                        <option value="Tocantins">Tocantins (TO)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Cidade onde desapareceu" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="data_desaparecimento">Data do desaparecimento</label>
                    <input type="date" id="data_desaparecimento" name="data_desaparecimento" required />
                </div>
            </div>

            <!-- Fotos -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-camera" style="margin-right:8px; color:#2a6f9c;"></i> Fotos</div>

                <div class="form-group">
                    <label for="foto">Selecione</label>
                    <div class="upload-area" onclick="document.getElementById('foto').click();">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="foto-texto">Clique para selecionar uma foto<span class="file-name" id="foto-nome"></span></span>
                        <input type="file" id="foto" name="foto" accept="image/*" />
                    </div>
                </div>
            </div>

            <!-- Revisão -->
            <div class="form-section">
                <div class="section-title"><i class="fas fa-check-circle" style="margin-right:8px; color:#2a6f9c;"></i> Revisão</div>

                <div class="review-box">
                    <p><i class="fas fa-arrow-right"></i> <span class="next-step">Próximo passo:</span> Preencha o máximo de informações possível. Quanto mais detalhes, maiores as chances de encontrar.</p>
                </div>
            </div>

            <div id="status" class="status" role="alert" aria-live="polite"></div>

            <!-- Botão continuar -->
            <button type="submit" class="btn-continue">Continuar</button>

        </form>

    </div>
<script>
    const API_URL = 'https://spes-backend.onrender.com/api';
    const token = localStorage.getItem('token');

    const form = document.getElementById('form-desaparecido');
    const statusEl = document.getElementById('status');
    const botao = form.querySelector('button[type="submit"]');
    const fotoInput = document.getElementById('foto');
    const fotoNome = document.getElementById('foto-nome');

    // ---------- mensagens na tela (no lugar de alert) ----------
    function mostrarStatus(texto, tipo) {
        statusEl.className = 'status ' + tipo;
        statusEl.textContent = texto;
    }

    function avisoDeLogin() {
        statusEl.className = 'status info';
        statusEl.textContent = 'Você precisa estar logado para cadastrar uma pessoa. ';
        const link = document.createElement('a');
        link.href = 'Tela de login.htm';
        link.textContent = 'Entrar';
        statusEl.appendChild(link);
    }

    if (!token) avisoDeLogin();

    // ---------- datas: não permitir datas no futuro ----------
    const agora = new Date();
    const hojeISO = new Date(agora.getTime() - agora.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    document.getElementById('data_nasc').max = hojeISO;
    document.getElementById('data_desaparecimento').max = hojeISO;

    // ---------- nome da foto escolhida ----------
    fotoInput.addEventListener('change', () => {
        fotoNome.textContent = fotoInput.files[0] ? fotoInput.files[0].name : '';
    });

    // ---------- reduz a foto antes de enviar (evita payload gigante) ----------
    function lerFoto(arquivo, maxLado = 520, qualidade = 0.7) {
        return new Promise((resolve, reject) => {
            const url = URL.createObjectURL(arquivo);
            const img = new Image();
            img.onload = () => {
                const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * escala);
                canvas.height = Math.round(img.height * escala);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                URL.revokeObjectURL(url);
                resolve(canvas.toDataURL('image/jpeg', qualidade));
            };
            img.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('Não foi possível ler a imagem. Tente outro arquivo.'));
            };
            img.src = url;
        });
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (!token) {
            avisoDeLogin();
            return;
        }

        botao.disabled = true;
        botao.textContent = 'Enviando...';
        statusEl.className = 'status';

        try {
            // FormData só lê campos com atributo "name" (todos agora têm)
            const fd = new FormData(form);
            const texto = (campo) => (fd.get(campo) || '').toString().trim();
            const numero = (campo) => {
                const v = texto(campo);
                return v === '' ? '' : Number(v);
            };

            const dados = {
                nome: texto('nome'),
                data_nascimento: texto('data_nasc'),
                etnia: texto('cor_raca'),
                altura: numero('altura'),
                peso: numero('peso'),
                contato: texto('contato'),
                informacoes: texto('informacoes'),
                ultimas_localizacoes: texto('ultimas_localizacoes'),
                cidade: texto('cidade'),
                estado_desaparecimento: texto('EPD'),
                data_desaparecimento: texto('data_desaparecimento')
            };

            // não envia campos vazios
            Object.keys(dados).forEach((k) => {
                if (dados[k] === '') delete dados[k];
            });

            const arquivo = fotoInput.files[0];
            if (arquivo) {
                if (arquivo.size > 15 * 1024 * 1024) {
                    throw new Error('A foto é muito grande (máximo 15 MB).');
                }
                dados.foto = await lerFoto(arquivo);
            }

            const response = await fetch(`${API_URL}/people`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(dados)
            });

            const data = await response.json().catch(() => ({}));

            if (data.success) {
                mostrarStatus('Pessoa cadastrada com sucesso! Voltando para a página inicial...', 'ok');
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                return;
            }

            if (response.status === 401) {
                localStorage.removeItem('token');
                avisoDeLogin();
                statusEl.prepend('Sua sessão expirou. ');
            } else {
                const msg = (data.errors && data.errors[0] && data.errors[0].msg) || data.error || 'Erro ao cadastrar pessoa.';
                mostrarStatus(msg, 'erro');
            }
        } catch (error) {
            const aviso = error instanceof TypeError
                ? 'Erro ao conectar com a API. Se o servidor estava inativo, aguarde um minuto e tente de novo.'
                : error.message;
            mostrarStatus(aviso, 'erro');
        }

        botao.disabled = false;
        botao.textContent = 'Continuar';
    });
</script>
</body>
</html>
