<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPES · Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f0f5fa 0%, #dae8f2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: #ffffff;
            max-width: 420px;
            width: 100%;
            padding: 2.5rem 2.2rem 2.8rem;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25);
            border: 2px solid rgba(86, 164, 238);
        }

        .brand { text-align: center; margin-bottom: 1.8rem; }

        .brand h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0b2b4a;
            line-height: 1.1;
        }

        .brand .welcome {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1d3b55;
            margin-top: 1.2rem;
        }

        .brand .welcome small {
            display: block;
            font-weight: 400;
            font-size: 0.9rem;
            color: #4b6f8e;
        }

        .form-group { margin-top: 1.3rem; }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a3a54;
            margin-bottom: 0.3rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #d4e0ec;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #f9fcff;
            transition: 0.2s;
            outline: none;
            color: #0b2b4a;
        }

        .form-group input:focus {
            border-color: #2a6f9c;
            box-shadow: 0 0 0 4px rgba(42, 111, 156, 0.12);
            background: #fff;
        }

        .forgot-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }

        .forgot-row a {
            font-size: 0.85rem;
            color: #2a6f9c;
            font-weight: 500;
        }

        .forgot-row a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1.8rem;
            background: #2a6f9c;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(42, 111, 156, 0.25);
        }

        .btn-submit:hover { background: #1d5a7e; transform: scale(1.02); }

        .social-section { margin-top: 2rem; text-align: center; }

        .social-section .divider {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #8aa3bb;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }

        .social-section .divider::before,
        .social-section .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #d4e0ec;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            border: 1.5px solid #d4e0ec;
            background: #ffffff;
            color: #1a3a54;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .social-btn:hover {
            background: #f0f6fe;
            border-color: #b8cee3;
            transform: translateY(-2px);
        }

        .social-btn .fa-google { color: #db4437; }

        .signup-link {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.95rem;
            color: #3d6483;
        }

        .signup-link a { color: #2a6f9c; font-weight: 700; }

        @media (max-width: 500px) {
            .card { padding: 2rem 1.5rem 2.2rem; }
            .brand h1 { font-size: 2rem; }
            .social-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand">
            <img style="width: 100px; height: 100px;" src="Imagens do site/Logo da SPES.png" alt="Logo SPES">
            <h1>SPES</h1>
            <div class="welcome">
                Bem-vindo de volta!
                <small>Faça login para continuar</small>
            </div>
        </div>

        <form action="#" method="post" autocomplete="on">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu_email@example.com" />
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" />
            </div>

            <div class="forgot-row">
                <a href="esqueci-senha.html">Esqueceu sua senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="social-section">
            <div class="divider">Entre também pelo Google</div>
            <div class="social-buttons">
                <a href="#" class="social-btn google">
                    <i class="fab fa-google"></i> Google
                </a>
            </div>
        </div>

        <div class="signup-link">
            Não tem conta? <a href="Cadastro.htm">Cadastre-se</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://spes-backend.onrender.com/api';
        const form = document.querySelector('form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.user.nome);
                    alert('Login realizado com sucesso!');
                    window.location.href = 'index.html';
                } else {
                    alert(data.error || 'Erro ao fazer login');
                }
            } catch (error) {
                alert('Erro ao conectar com a API.');
            }
        });

        // LOGIN COM GOOGLE
        const GOOGLE_CLIENT_ID = '159287534210-dko5uuksj44r7u5th9kd91v3hipac2uv.apps.googleusercontent.com';
        let googleClient;

        window.addEventListener('load', () => {
            googleClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: 'email profile openid',
                callback: async (tokenResponse) => {
                    if (tokenResponse.error) { alert('Erro ao entrar com Google'); return; }
                    try {
                        const response = await fetch(`${API_URL}/auth/google`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ access_token: tokenResponse.access_token })
                        });
                        const data = await response.json();
                        if (data.success) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('userName', data.user.nome);
                            window.location.href = 'index.html';
                        } else {
                            alert(data.error || 'Erro ao entrar com Google');
                        }
                    } catch (error) {
                        alert('Erro ao conectar com a API.');
                    }
                }
            });
        });

        document.querySelector('.social-btn.google').addEventListener('click', (e) => {
            e.preventDefault();
            googleClient.requestAccessToken();
        });
    </script>
</body>
</html>
