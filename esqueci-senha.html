<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha | SPES</title><style>body{font-family:Arial,sans-serif;background:#f0f5f8;color:#18364a;margin:0;min-height:100vh;display:grid;place-items:center}main{background:white;padding:36px;border-radius:14px;box-shadow:0 8px 30px #16394a22;width:min(420px,85vw)}h1{font-size:1.5rem}label{display:block;margin:20px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #aac2cd;border-radius:8px}button{width:100%;background:#22698c;color:white;border:0;border-radius:8px;padding:13px;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.5}a{color:#22698c}#status{min-height:22px}</style></head><body><main><h1>Recuperar senha</h1><p>Informe o e-mail da sua conta. Enviaremos um link de recuperação, válido por 15 minutos.</p><form id="form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required maxlength="100"><button id="enviar">Enviar link</button></form><p id="status" role="status" aria-live="polite"></p><a href="Tela de login.htm">Voltar ao login</a></main><script>
document.getElementById('form').addEventListener('submit',async e=>{
e.preventDefault();const btn=document.getElementById('enviar'),status=document.getElementById('status');btn.disabled=true;status.textContent='Enviando...';
try{const r=await fetch('https://spes-backend.onrender.com/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const data=await r.json();status.textContent=r.ok?data.message:(data.error||'Erro ao solicitar recuperação.');}catch{status.textContent='Falha na conexão. Tente novamente.';}finally{btn.disabled=false;}
});
</script></body></html>
