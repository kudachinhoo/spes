<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha | SPES</title><style>body{font-family:Arial,sans-serif;background:#f0f5f8;color:#18364a;margin:0;min-height:100vh;display:grid;place-items:center}main{background:white;padding:36px;border-radius:14px;box-shadow:0 8px 30px #16394a22;width:min(420px,85vw)}h1{font-size:1.5rem}label{display:block;margin:20px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #aac2cd;border-radius:8px}button{width:100%;background:#22698c;color:white;border:0;border-radius:8px;padding:13px;margin-top:22px;cursor:pointer}button:disabled{opacity:.6}p{line-height:1.5}a{color:#22698c}#status{min-height:22px}</style></head><body><main><h1>Criar nova senha</h1><p>Digite sua nova senha (mínimo de 8 caracteres).</p><form id="form"><label for="senha">Nova senha</label><input id="senha" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><label for="confirmacao">Confirmar senha</label><input id="confirmacao" type="password" minlength="8" maxlength="128" autocomplete="new-password" required><button id="enviar">Alterar senha</button></form><p id="status" role="status" aria-live="polite"></p><a href="Tela de login.htm">Voltar ao login</a></main><script>
const token=new URLSearchParams(location.search).get('token');
if(!token){document.getElementById('status').textContent='Link inválido. Solicite outro e-mail de recuperação.';document.getElementById('enviar').disabled=true;}
document.getElementById('form').addEventListener('submit',async e=>{
e.preventDefault();const senha=document.getElementById('senha').value,status=document.getElementById('status'),btn=document.getElementById('enviar');
if(senha!==document.getElementById('confirmacao').value){status.textContent='As senhas não coincidem.';return;}
btn.disabled=true;status.textContent='Alterando...';
try{const r=await fetch('https://spes-backend.onrender.com/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,senha})});const data=await r.json();status.textContent=data.message||data.error||'Não foi possível alterar a senha.';if(r.ok){document.getElementById('form').reset();setTimeout(()=>location.href='Tela de login.htm',2000);}else btn.disabled=false;}catch{status.textContent='Falha na conexão. Tente novamente.';btn.disabled=false;}
});
</script></body></html>
