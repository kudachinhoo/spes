<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPES · Cadastro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Converte o .docx em HTML para mostrar dentro do modal -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            color: #1a2639;
            line-height: 1.5;
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }

        /* ----- TOP BAR ----- */
        .top-bar {
            background-color: #ffffff;
            padding: 0 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #e6edf5;
        }

        .logo-area { display: flex; align-items: center; gap: 8px; padding: 1rem 0; }

        .logo-area h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #0b2b4a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #Logo { width: 70px; height: 70px; margin-bottom: -10px; }

        .nav-menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.2rem 1.2rem;
            padding: 0.8rem 0;
        }

        .nav-menu a {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e3b5c;
            padding: 0.3rem 0.2rem;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .nav-menu a:hover { border-bottom-color: #2a6f9c; color: #0b2b4a; }

        .nav-menu .btn-outline {
            border: 1.5px solid #2a6f9c;
            border-radius: 30px;
            padding: 0.3rem 1.2rem;
            font-weight: 600;
            color: #2a6f9c;
        }

        .nav-menu .btn-outline:hover { background: #2a6f9c; color: #fff; }

        .nav-menu .btn-solid {
            background: #2a6f9c;
            border-radius: 30px;
            padding: 0.3rem 1.4rem;
            font-weight: 600;
            color: #fff;
        }

        .nav-menu .btn-solid:hover { background: #1d4f73; }

        #areaUsuario { display: none; align-items: center; gap: 0.8rem; }
        #nomeUsuario { color: #1e3b5c; font-weight: 600; }

        /* ----- CONTEÚDO ----- */
        .conteudo-pagina {
            max-width: 560px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .card {
            background: #ffffff;
            padding: 2.5rem 2.2rem 2.8rem;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.15);
            border: 2px solid rgba(86, 164, 238, 0.3);
        }

        .brand { text-align: center; margin-bottom: 1.8rem; }

        .brand h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #0b2b4a;
            line-height: 1.1;
        }

        .brand .tagline {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1d3b55;
            margin-top: 1rem;
        }

        .brand .tagline small {
            display: block;
            font-weight: 400;
            font-size: 0.9rem;
            color: #4b6f8e;
        }

        .form-group { margin-top: 1.3rem; }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a3a54;
            margin-bottom: 0.3rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #d4e0ec;
            border-radius: 60px;
            font-size: 0.95rem;
            background: #f9fcff;
            transition: 0.2s;
            outline: none;
            color: #0b2b4a;
        }

        .form-group input:focus {
            border-color: #2a6f9c;
            box-shadow: 0 0 0 4px rgba(42, 111, 156, 0.12);
            background: #ffffff;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            margin-top: 1.6rem;
            font-size: 0.88rem;
            color: #1e3b5c;
        }

        .checkbox-group input[type="checkbox"] {
            width: 1.1rem; height: 1.1rem;
            margin-top: 0.15rem;
            accent-color: #2a6f9c;
            cursor: pointer;
        }

        .checkbox-group a { color: #2a6f9c; font-weight: 600; cursor: pointer; }
        .checkbox-group a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            margin-top: 1.8rem;
            background: #2a6f9c;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(42, 111, 156, 0.25);
        }

        .btn-submit:hover { background: #1d5a7e; transform: scale(1.02); }

        /* ----- DIVISOR + BOTÃO GOOGLE ----- */
        .divisor {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-top: 1.6rem;
            color: #4b6f8e;
            font-size: 0.85rem;
        }

        .divisor::before,
        .divisor::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #d4e0ec;
        }

        #googleBtn {
            display: flex;
            justify-content: center;
            margin-top: 1.2rem;
            min-height: 44px;
        }

        .google-aviso {
            text-align: center;
            font-size: 0.78rem;
            color: #4b6f8e;
            margin-top: 0.6rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.95rem;
            color: #3d6483;
        }

        .login-link a { color: #2a6f9c; font-weight: 700; margin-left: 0.2rem; }
        .login-link a:hover { text-decoration: underline; }

        /* ----- MODAL (Termos / Política) ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11, 43, 74, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            z-index: 1000;
        }

        .modal-overlay.aberto { display: flex; }

        .modal-box {
            background: #ffffff;
            width: 100%;
            max-width: 720px;
            max-height: 85vh;
            border-radius: 24px;
            box-shadow: 0 30px 60px -15px rgba(0, 20, 40, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 1.5rem;
            border-bottom: 2px solid #e6edf5;
        }

        .modal-header h2 { font-size: 1.25rem; color: #0b2b4a; }

        .modal-fechar {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            color: #4b6f8e;
            cursor: pointer;
            padding: 0 0.3rem;
        }

        .modal-fechar:hover { color: #0b2b4a; }

        .modal-corpo {
            padding: 1.4rem 1.6rem;
            overflow-y: auto;
            font-size: 0.95rem;
            color: #1a2639;
        }

        .modal-corpo h1, .modal-corpo h2, .modal-corpo h3 { color: #0b2b4a; margin: 1.1rem 0 0.5rem; }
        .modal-corpo p { margin-bottom: 0.8rem; }
        .modal-corpo ul, .modal-corpo ol { margin: 0 0 0.8rem 1.4rem; }
        .modal-corpo table { border-collapse: collapse; margin-bottom: 0.8rem; }
        .modal-corpo td, .modal-corpo th { border: 1px solid #d4e0ec; padding: 0.4rem 0.6rem; }

        .modal-rodape {
            padding: 0.9rem 1.5rem;
            border-top: 2px solid #e6edf5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .modal-rodape a { color: #2a6f9c; font-weight: 600; font-size: 0.88rem; }
        .modal-rodape a:hover { text-decoration: underline; }

        .modal-rodape button {
            background: #2a6f9c;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 0.5rem 1.6rem;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-rodape button:hover { background: #1d4f73; }

        @media (max-width: 620px) {
            .top-bar { flex-direction: column; align-items: stretch; padding: 0 1rem; }
            .logo-area { justify-content: center; }
            .nav-menu { justify-content: center; padding: 0.6rem 0 1rem; }
            #Logo { width: 55px; height: 55px; }
            .conteudo-pagina { padding: 2rem 1rem; }
            .card { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <div class="logo-area">
            <h1>
                <img id="Logo" src="Imagens do site/Logo da SPES.png" alt="Logo da SPES">
                SPES
            </h1>
        </div>
        <nav class="nav-menu">
            <a href="index.html">Início</a>
            <a href="Separação de casos.html">Desaparecidos</a>
            <a href="Como ajudar.html">Como ajudar</a>
            <a href="Seja nosso parceiro.html">Parceiros</a>
            <a href="Sobre.html">Sobre Nós</a>
            <a href="Tela de login.htm" class="btn-outline" id="btnEntrar">Entrar</a>
            <a href="Cadastro.htm" class="btn-solid" id="btnCadastrar">Cadastrar</a>
            <div id="areaUsuario">
                <span id="nomeUsuario"></span>
                <a href="#" id="btnSair" class="btn-outline">Sair</a>
            </div>
        </nav>
    </header>

    <div class="conteudo-pagina">
        <div class="card">
            <div class="brand">
                <h1>SPES</h1>
                <div class="tagline">
                    Crie sua conta
                    <small>Ajude a salvar vidas.</small>
                </div>
            </div>

            <form action="#" method="post" autocomplete="off">
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required />
                </div>

                <div class="form-group">
                    <label for="CPF">CPF</label>
                    <input type="text" id="CPF" inputmode="numeric" pattern="\d{11}" title="Digite os 11 números do CPF" placeholder="Digite seu CPF" required minlength="11" maxlength="11" />
                </div>

                <div class="form-group">
                    <label for="TEL">Número de telefone</label>
                    <input type="tel" id="TEL" placeholder="Digite seu telefone" required minlength="11" />
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu_email@example.com" required />
                </div>

                <div class="form-group">
                    <label for="senha">Senha <span style="font-weight:400; color:#4b6f8e; font-size:0.8rem;">(mínimo 6 caracteres)</span></label>
                    <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" minlength="6" required />
                </div>

                <div class="form-group">
                    <label for="confirmar">Confirme sua senha</label>
                    <input type="password" id="confirmar" placeholder="Digite novamente sua senha" required />
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consentimento" required />
                    <label for="consentimento">
                        Li e concordo com os
                        <a href="#" class="doc-link" data-doc="documentos do site/Termos_de_Uso_SPES.docx" data-titulo="Termos de Uso">Termos de Uso</a>
                        e a
                        <a href="#" class="doc-link" data-doc="documentos do site/Politica_de_Privacidade_SPES.docx" data-titulo="Política de Privacidade">Política de Privacidade</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>

            <div class="divisor">ou</div>
            <div id="googleBtn"></div>
            <p class="google-aviso">Para usar o Google, preencha CPF e telefone e aceite os termos acima.</p>

            <div class="login-link">
                Já tem conta? <a href="Tela de login.htm">Entrar</a>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalDoc" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitulo"></h2>
                <button type="button" class="modal-fechar" id="modalFechar" aria-label="Fechar">&times;</button>
            </div>
            <div class="modal-corpo" id="modalCorpo"></div>
            <div class="modal-rodape">
                <a href="#" id="modalDownload" download>Baixar documento</a>
                <button type="button" id="modalOk">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- LOGIN / LOGOUT ----------
        const tokenLog = localStorage.getItem('token');
        const userName = localStorage.getItem('userName');
        const btnEntrar = document.getElementById('btnEntrar');
        const btnCadastrar = document.getElementById('btnCadastrar');
        const areaUsuario = document.getElementById('areaUsuario');
        const nomeUsuario = document.getElementById('nomeUsuario');
        const btnSair = document.getElementById('btnSair');

        if (tokenLog && userName) {
            if (btnEntrar) btnEntrar.style.display = 'none';
            if (btnCadastrar) btnCadastrar.style.display = 'none';
            if (areaUsuario) areaUsuario.style.display = 'flex';
            if (nomeUsuario) nomeUsuario.textContent = `Olá, ${userName.split(' ')[0]}`;
        }

        if (btnSair) {
            btnSair.addEventListener('click', (e) => {
                e.preventDefault();
                if (confirm('Deseja sair da sua conta?')) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('userName');
                    window.location.href = 'index.html';
                }
            });
        }

        // ---------- MODAL TERMOS / POLÍTICA ----------
        const modalDoc = document.getElementById('modalDoc');
        const modalTitulo = document.getElementById('modalTitulo');
        const modalCorpo = document.getElementById('modalCorpo');
        const modalDownload = document.getElementById('modalDownload');

        function fecharModal() {
            modalDoc.classList.remove('aberto');
            document.body.style.overflow = '';
        }

        async function abrirModal(caminho, titulo) {
            modalTitulo.textContent = titulo;
            modalCorpo.innerHTML = '<p>Carregando...</p>';
            modalDownload.href = encodeURI(caminho);
            modalDoc.classList.add('aberto');
            document.body.style.overflow = 'hidden';

            try {
                const resp = await fetch(encodeURI(caminho));
                if (!resp.ok) throw new Error('Arquivo não encontrado');
                const buffer = await resp.arrayBuffer();
                const resultado = await mammoth.convertToHtml({ arrayBuffer: buffer });
                modalCorpo.innerHTML = resultado.value || '<p>Documento vazio.</p>';
            } catch (err) {
                modalCorpo.innerHTML =
                    '<p>Não foi possível carregar o texto aqui. ' +
                    'Use o link "Baixar documento" abaixo para ler o arquivo.</p>';
            }
        }

        document.querySelectorAll('.doc-link').forEach((link) => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                abrirModal(link.dataset.doc, link.dataset.titulo);
            });
        });

        document.getElementById('modalFechar').addEventListener('click', fecharModal);
        document.getElementById('modalOk').addEventListener('click', fecharModal);
        modalDoc.addEventListener('click', (e) => { if (e.target === modalDoc) fecharModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharModal(); });

        // ---------- FORMULÁRIO ----------
        const API_URL = 'https://spes-backend.onrender.com/api';
        const form = document.querySelector('form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const cpf = document.getElementById('CPF').value;
            const telefone = document.getElementById('TEL').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar').value;

            if (senha !== confirmar) {
                alert('As senhas não coincidem!');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, cpf, telefone, email, senha })
                });

                const data = await response.json();

                if (data.success) {
                    alert('Conta criada com sucesso!');
                    window.location.href = 'Tela de login.htm';
                } else {
                    alert(data.errors?.[0]?.msg || data.error || 'Erro ao criar conta');
                }
            } catch (error) {
                alert('Erro ao conectar com a API');
            }
        });

        // ---------- CADASTRO COM GOOGLE ----------
        // ID do cliente OAuth (público). Também precisa estar em GOOGLE_CLIENT_IDS no Render.
        const GOOGLE_CLIENT_ID = '159287534210-qqa5lsrjbhkqj5ktug2f75t5tj57lem3.apps.googleusercontent.com';

        async function aoReceberGoogle(resposta) {
            const consentimento = document.getElementById('consentimento').checked;
            const cpf = document.getElementById('CPF').value.trim();
            const telefone = document.getElementById('TEL').value.trim();

            if (!consentimento) {
                alert('Para continuar, aceite os Termos de Uso e a Política de Privacidade.');
                return;
            }
            if (!/^\d{11}$/.test(cpf) || telefone.length < 11) {
                alert('Preencha o CPF (11 números) e o telefone e clique novamente no botão do Google.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: resposta.credential, cpf, telefone })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userName', data.user?.nome || '');
                    alert('Conta criada com sucesso!');
                    window.location.href = 'index.html';
                } else {
                    alert(data.errors?.[0]?.msg || data.error || 'Erro ao cadastrar com o Google');
                }
            } catch (error) {
                alert('Erro ao conectar com a API');
            }
        }

        function iniciarGoogle() {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: aoReceberGoogle
            });
            google.accounts.id.renderButton(document.getElementById('googleBtn'), {
                theme: 'outline',
                size: 'large',
                shape: 'pill',
                text: 'signup_with',
                locale: 'pt-BR',
                width: 320
            });
        }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="iniciarGoogle()"></script>
</body>
</html>
