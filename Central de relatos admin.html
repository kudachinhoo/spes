<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPES | Central administrativa de relatos</title><style>body{font:16px Inter,Segoe UI,Arial,sans-serif;background:#f4f7fc;color:#12324c;margin:0}header{background:#fff;padding:20px 5%;border-bottom:2px solid #dce8f2}main{max-width:1000px;margin:30px auto;padding:0 20px}.card{background:#fff;padding:22px;margin:16px 0;border:1px solid #dce8f2;border-radius:16px;overflow-wrap:anywhere}button,select{padding:10px;border-radius:9px;border:1px solid #2a6f9c;margin:6px}button{background:#2a6f9c;color:white;cursor:pointer}p{line-height:1.5}small{color:#567}a{color:#1d5a7e}</style></head><body><header><strong>SPES · Central administrativa de relatos</strong> · <a href="Admin.html">Voltar ao painel</a></header><main><h1>Relatos recebidos</h1><p>Área exclusiva para administradores. Não compartilhe dados de contato ou informações sensíveis sem autorização.</p><p id="aviso" role="status">Carregando...</p><section id="lista"></section></main><script>
const API='https://spes-backend.onrender.com/api';const token=localStorage.getItem('token');const lista=document.getElementById('lista');const aviso=document.getElementById('aviso');
async function request(path,options={}){const r=await fetch(API+path,{...options,headers:{Authorization:'Bearer '+token,...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Acesso negado');return d;}
async function carregar(){try{if(!token)throw Error('Faça login como administrador.');const rows=await request('/relatos/admin');aviso.textContent=rows.length+' relato(s) encontrado(s).';lista.replaceChildren();for(const r of rows){const card=document.createElement('article');card.className='card';const h=document.createElement('h2');h.textContent='Relato #'+r.id+' · '+r.tipo;const p=document.createElement('p');p.textContent=r.descricao;const meta=document.createElement('p');meta.textContent=(r.id_desaparecido?'Ocorrência #'+r.id_desaparecido:'Relato geral')+' · '+new Date(r.criado_em).toLocaleString('pt-BR');card.append(h,meta,p);for(const [nome,valor] of [['Local',r.local_informado],['Data',r.data_avistamento],['Período',r.periodo],['Contato (restrito)',r.contato]]){if(valor){const x=document.createElement('p');x.textContent=nome+': '+valor;card.append(x);}}const sel=document.createElement('select');for(const [v,label] of [['recebido','Recebido'],['em_analise','Em análise'],['encaminhado','Liberado ao responsável'],['encerrado','Encerrado']]){if(v==='encaminhado'&&!r.id_desaparecido)continue;sel.add(new Option(label,v));}sel.value=r.status;const btn=document.createElement('button');btn.textContent='Salvar status';btn.onclick=async()=>{try{await request('/relatos/admin/'+r.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:sel.value})});aviso.textContent='Status do relato #'+r.id+' atualizado.';}catch(e){aviso.textContent=e.message;}};card.append(sel,btn);lista.append(card);}}catch(e){aviso.textContent=e.message;}}carregar();
</script></body></html>
